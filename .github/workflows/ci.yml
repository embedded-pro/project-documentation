---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy (strict)
        run: python -m mypy src/project_documentation

  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/unit -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest tests/unit --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern
      - name: Run integration tests
        run: python -m pytest tests/integration -v

  action-smoke:
    name: Action smoke test
    runs-on: ubuntu-latest
    needs: [lint, unit]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate requirements + documents
        uses: ./
        with:
          run-validate-requirements: 'true'
          run-validate-documents: 'true'
          schema-path: examples/e-foc/requirement.schema.json
          requirements-dir: examples/e-foc/requirements
          documents-dir: examples/e-foc/documentation
          doc-type: all
          package-version: " @ git+file://${{ github.workspace }}"

      - name: Generate requirements PDF
        uses: ./
        with:
          run-generate-requirements-pdf: 'true'
          requirements-dir: examples/e-foc/requirements
          template-path: examples/e-foc/templates/requirements.md
          requirements-pdf-output: examples/e-foc/output/requirements.pdf
          package-version: " @ git+file://${{ github.workspace }}"

      - name: Build documentation PDFs
        uses: ./
        with:
          run-build-documentation-pdfs: 'true'
          version: "v0.0.0-smoke"
          output-dir: /tmp/smoke-docs-pdf
          docs-dirs: "examples/e-foc/documentation"
          requirements-dir: examples/e-foc/requirements
          package-version: " @ git+file://${{ github.workspace }}"

      - name: Generate traceability matrix
        uses: ./
        with:
          run-traceability-matrix: 'true'
          requirements-dir: examples/e-foc/requirements
          features-dir: examples/e-foc/features
          matrix-output: /tmp/smoke-matrix.md
          package-version: " @ git+file://${{ github.workspace }}"

      - name: Verify matrix output exists and is non-empty
        run: |
          [[ -s /tmp/smoke-matrix.md ]] || { echo "Matrix output missing or empty"; exit 1; }
          grep -q "REQ-FOC-001" /tmp/smoke-matrix.md || { echo "REQ-FOC-001 not found in matrix"; exit 1; }
          echo "✓ Traceability matrix OK"
        shell: bash
