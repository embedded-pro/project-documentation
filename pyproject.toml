[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "project-documentation"
version = "0.1.0"
description = "Documentation pipeline for embedded projects: validates requirements and design documents, generates PDFs, and produces a traceability matrix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
    "documentation",
    "requirements",
    "traceability",
    "embedded",
    "ci",
    "github-action",
    "pdf",
    "validation",
]
authors = [
    { name = "project-documentation contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
]

[project.scripts]
project-documentation-validate-requirements = "project_documentation.validate_requirements:main"
project-documentation-validate-documents    = "project_documentation.validate_documents:main"
project-documentation-generate-requirements-pdf = "project_documentation.generate_requirements_pdf:main"
project-documentation-build-pdfs           = "project_documentation.build_documentation_pdfs:main"
project-documentation-traceability-matrix  = "project_documentation.generate_traceability_matrix:main"

[project.urls]
Homepage      = "https://github.com/embedded-pro/project-documentation"
Documentation = "https://github.com/embedded-pro/project-documentation/tree/main/docs"
Issues        = "https://github.com/embedded-pro/project-documentation/issues"
Changelog     = "https://github.com/embedded-pro/project-documentation/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/project_documentation"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "examples/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "action.yml",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths  = ["tests"]
addopts    = ["-ra", "--strict-markers", "--strict-config"]
markers    = [
    "integration: tests requiring pandoc/pdflatex toolchain",
]

[tool.coverage.run]
source = ["src/project_documentation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length    = 100
target-version = "py311"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF043"]

[tool.mypy]
python_version      = "3.11"
strict              = true
files               = ["src/project_documentation"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes    = true

[[tool.mypy.overrides]]
module        = "tests.*"
ignore_errors = true
